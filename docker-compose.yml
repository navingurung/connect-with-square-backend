services:
  postgres:
    image: postgres:16
    container_name: square_samurai_test_postgres
    environment:
      POSTGRES_DB: square_samurai_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5544:5432"
    volumes:
      - square_samurai_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d square_samurai_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: square_samurai_test_backend
    env_file:
      - .env
    ports:
      - "8800:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  square_samurai_test_postgres_data: